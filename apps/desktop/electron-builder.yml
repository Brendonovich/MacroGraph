appId: macrograph.brendonovich.dev
productName: MacroGraph
directories:
  buildResources: resources
  output: release
files:
  - dist-electron
  - ".output/public/**/*"
  - "package.json"
  - "remote-public/**/*"
extraResources:
  - from: remote-public
    to: remote-public
    filter:
      - "**/*"
  - from: electron/whisper-native
    to: whisper-native
    filter:
      - "**/*"
asar: true
asarUnpack:
  - "**/*.node"
  - "**/whisper-addon*"
compression: normal
nodeGypRebuild: false
npmRebuild: false
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.productivity
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: resources
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
